server:
  port: 8080

spring:
  application:
    name: na-payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/na_paymentdb}
    username: ${SPRING_DATASOURCE_USERNAME:na_payment_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  internal:
    token: ${APP_INTERNAL_TOKEN:}
  mock:
    delay-ms: ${APP_MOCK_DELAY_MS:0}
