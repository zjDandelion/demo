spring:
  datasource:
    url: jdbc:h2:mem:na-order-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;LOCK_TIMEOUT=10000
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false

app:
  seed:
    enabled: false
  reconciliation:
    enabled: false
  payment:
    base-url: http://localhost:8091
    service-token: test-token
  assistant:
    catalog-cache-ttl-ms: 0
