services:
  na-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: na_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NA_ORDER_DB_PASSWORD: ${NA_ORDER_DB_PASSWORD}
      NA_PAYMENT_DB_PASSWORD: ${NA_PAYMENT_DB_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - na-pg-data:/var/lib/postgresql/data
      - ./scripts/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U na_admin -d postgres"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  na-payment-service:
    build:
      context: .
      dockerfile: na-payment-service/Dockerfile
    image: ${NA_PAYMENT_IMAGE:-na-payment-service:local}
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://na-postgres:5432/na_paymentdb
      SPRING_DATASOURCE_USERNAME: na_payment_user
      SPRING_DATASOURCE_PASSWORD: ${NA_PAYMENT_DB_PASSWORD}
      APP_INTERNAL_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m -Duser.timezone=Asia/Shanghai"
    expose:
      - "8080"
    depends_on:
      na-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    mem_limit: 768m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  na-assistant-service:
    build:
      context: .
      dockerfile: na-assistant-service/Dockerfile
    image: ${NA_ASSISTANT_IMAGE:-na-assistant-service:local}
    environment:
      ASSISTANT_INTERNAL_TOKEN: ${ASSISTANT_SERVICE_TOKEN:-}
      ASSISTANT_BASE_URL: ${ASSISTANT_BASE_URL:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-}
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
      ASSISTANT_DEBUG: "0"
      ASSISTANT_TIMEOUT_MS: "4000"
      TZ: Asia/Shanghai
    expose:
      - "8092"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8092/health')"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  na-order-service:
    build:
      context: .
      dockerfile: na-order-service/Dockerfile
    image: ${NA_ORDER_IMAGE:-na-order-service:local}
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://na-postgres:5432/na_orderdb
      SPRING_DATASOURCE_USERNAME: na_order_user
      SPRING_DATASOURCE_PASSWORD: ${NA_ORDER_DB_PASSWORD}
      APP_PAYMENT_BASE_URL: http://na-payment-service:8080
      APP_PAYMENT_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      APP_PAYMENT_CONNECT_TIMEOUT_MS: "2000"
      APP_PAYMENT_READ_TIMEOUT_MS: "5000"
      APP_RECONCILIATION_ENABLED: "true"
      APP_ASSISTANT_ENABLED: "false"
      APP_ASSISTANT_URL: http://na-assistant-service:8092
      APP_ASSISTANT_TOKEN: ${ASSISTANT_SERVICE_TOKEN:-}
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m -Duser.timezone=Asia/Shanghai"
    ports:
      - "8081:8080"
    depends_on:
      na-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    mem_limit: 1g
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  na-pg-data:
